name: 🚀 Automatic Oracle Cloud Auto-Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.oracle.yml'
      - 'nginx.oracle.conf'
      - 'scripts/**'
      - '.github/workflows/deploy_oracle.yml'

jobs:
  deploy:
    name: Deploy to Oracle Cloud ARM Instance
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Configure SSH Private Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: 🚀 Deploy & Rebuild Container on Oracle Cloud
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.ORACLE_USERNAME }}@${{ secrets.ORACLE_HOST }} "
            cd ~/Pixel_Mark && \
            git pull origin main && \
            sudo docker compose -f docker-compose.oracle.yml up -d --build backend
          "
