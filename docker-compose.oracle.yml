version: '3.8'

services:
  # 1. Production PostgreSQL 16 (Tuned for OCI Ampere 24GB RAM)
  postgres:
    image: postgres:16-alpine
    container_name: stage_oracle_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stage_db}
      POSTGRES_USER: ${POSTGRES_USER:-stage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stage_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # Localhost only for security
    command: >
      postgres
      -c shared_buffers=4GB
      -c effective_cache_size=12GB
      -c maintenance_work_mem=1GB
      -c work_mem=64MB
      -c max_connections=150
      -c random_page_cost=1.1
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stage_user} -d ${POSTGRES_DB:-stage_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Realtime Broadcaster
  redis:
    image: redis:7-alpine
    container_name: stage_oracle_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-stage_redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-stage_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. STAGE FastAPI Backend (ARM64 Optimized for OCI Ampere)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.arm64
    container_name: stage_oracle_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-stage_user}:${POSTGRES_PASSWORD:-stage_secure_password_2026}@postgres:5432/${POSTGRES_DB:-stage_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-stage_redis_secret}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=production
      - CORS_ORIGINS=${CORS_ORIGINS:-https://pixel-mark.onrender.com,http://localhost:3000}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PROVIDER_SECRETS_ENCRYPTION_KEY=${PROVIDER_SECRETS_ENCRYPTION_KEY}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - STAGE_FOUNDER_EMAIL=${STAGE_FOUNDER_EMAIL}
      - STAGE_FOUNDER_EMAILS=${STAGE_FOUNDER_EMAILS}
      - FIGMA_CLIENT_ID=${FIGMA_CLIENT_ID}
      - FIGMA_CLIENT_SECRET=${FIGMA_CLIENT_SECRET}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - workspace_data:/app/workspaces

  # 4. Nginx Reverse Proxy with Automated SSL & WebSockets
  nginx:
    image: nginx:alpine
    container_name: stage_oracle_nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.oracle.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  workspace_data:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local
