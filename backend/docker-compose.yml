version: '3.8'

services:
  stage-backend:
    build:
      context: .
      dockerfile: Dockerfile.arm64
    container_name: stage-backend
    restart: always
    # Chromium shared memory & IPC optimization for Linux/ARM64
    ipc: host
    shm_size: '1gb'
    ports:
      - '127.0.0.1:8765:8765'
    env_file:
      - .env
    volumes:
      - stage_cache:/app/cache
    deploy:
      resources:
        limits:
          memory: 8192M
        reservations:
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8765/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  stage_cache:
    driver: local
